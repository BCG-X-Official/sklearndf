name: sklearndf-develop
channels:
  - conda-forge
  - bcg_gamma
dependencies:
  # run
  - gamma-pytools     ~= 3.0, >=3.0.3
  - joblib            ~= 1.6
  - lightgbm          ~= 4.7
  - matplotlib        ~= 3.11
  - numpy             ~= 2.5
  - packaging         >= 26
  - pandas            ~= 3.1
  - pip               ~= 25.1
  - python            ~= 3.14.10
  - scikit-learn      ~= 1.7.2
  - scipy             ~= 1.18
  - xgboost           ~= 3.4
  - pip:
      - arfs          ~= 2.4
      - Boruta        ~= 0.4
  # test
  - pytest            ~= 8.1
  - pytest-cov        ~= 4.1
  # sphinx
  - nbsphinx                 ~= 0.9
  - sphinx                   ~= 7.2
  - sphinx-autodoc-typehints ~= 1.24
  - pydata-sphinx-theme      ~= 0.15
  # notebooks
  - ipywidgets        ~= 8.1
  - jupyterlab        ~= 4.1
  - openpyxl          ~= 3.1
  - seaborn           ~= 0.13
  - tableone          ~= 0.8
