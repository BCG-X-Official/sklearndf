[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
exclude = [".idea", "tmp", "dist", ".tox", ".pytest_cache"]

[tool.flit.metadata]
module = "sklearndf"
author = "Boston Consulting Group (BCG)"
home-page = "https://github.com/BCG-X-Official/sklearndf"
description-file = "pypi_description.rst"
dist-name = "sklearndf"
license = "Apache Software License v2.0"

requires = [
    "gamma-pytools  ~=3.0",
    "numpy          >=1.21,<3a",
    "packaging      >=20",
    "pandas         >=1",
    "scikit-learn   >=1.3,<1.8a",
    "scipy          ~=1.6",
]

requires-python = ">=3.11,<4a"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[tool.flit.metadata.requires-extra]
testing = [
    "pytest ~= 8.1",
    "pytest-cov ~= 4.1",
    # optional requirements for testing sklearndf
    "lightgbm >= 3",
    "xgboost >= 1",
]
docs = [
    "sphinx ~= 4.5",
    "sphinx-autodoc-typehints ~= 1.19",
    "pydata-sphinx-theme ~= 0.8.1",
    "jinja2 ~= 2.11",
    "nbsphinx ~= 0.8.9",
    "jupyter == 1",
    "docutils ~= 0.17",
    "xlrd ~= 1.2",
    "m2r ~= 0.2"
]

[tool.flit.metadata.urls]
Documentation = "https://bcg-x-official.github.io/sklearndf/"
Repository = "https://github.com/BCG-X-Official/sklearndf"

[build]
# comma-separated list of packages to be built from source in pip min builds
no-binary.min = ["matplotlib"]

[build.matrix.min]
# direct requirements of sklearndf
boruta = "~=0.3.0"
gamma-pytools = "~=3.0.2"
lightgbm = "~=3.3.5"
numpy = "~=1.23.5"
packaging = "~=20.9"
pandas = "~=1.5.3"
python = "~=3.11.0"
scipy = "~=1.9.3"
scikit-learn = "~=1.3.2"
xgboost = "~=1.7.0"
# additional minimum requirements of gamma-pytools
joblib = "~=1.1.1"
matplotlib = "~=3.6.3"
typing_inspect = "~=0.7.1"

[build.matrix.max]
# direct requirements of sklearndf
arfs = "~=2.4"
gamma-pytools = "~=3.0,>=3.0.3"
lightgbm = "~=4.7"
numpy = "~=2.5"
packaging = ">=26"
pandas = "~=3.1"
python = "~=3.14"
scikit-learn = "~=1.7.1"
scipy = "~=1.18"
xgboost = "~=3.4"
# additional maximum requirements of gamma-pytools
joblib = "~=1.6"
matplotlib = "~=3.11"
typing_inspect = "~=0.9"

[tool.black]
# quiet = "True"
line-length = 88
target_version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | data
    | docs
    | notebooks
    | sphinx
  )/
)
'''

[tool.mypy]
strict = true
show_error_codes = true
# sphinx/base is downloaded at docs build time, and is not part of the checkout
exclude = ["sphinx/base/"]

[[tool.mypy.overrides]]
module = [
    "arfs.*",
    "boruta.*",
    "conf_base",  # provided by sphinx/base at docs build time
    "joblib.*",
    "lightgbm.*",
    "packaging.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "xgboost.*"
]
ignore_missing_imports = true
